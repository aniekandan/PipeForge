name: Build/Release PipeForge

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules, package-lock.json -ErrorAction SilentlyContinue
          npm install --include=optional --no-audit --no-fund

          # Repair native optional dependencies if npm skipped them
          if (-not (Test-Path "node_modules/@tailwindcss/oxide-win32-x64-msvc")) {
            npm install --no-save --include=optional @tailwindcss/oxide-win32-x64-msvc@^4.3.3 --no-audit --no-fund
          }

          if (-not (Test-Path "node_modules/@rolldown/binding-win32-x64-msvc")) {
            npm install --no-save --include=optional @rolldown/binding-win32-x64-msvc@1.2.11 --no-audit --no-fund
          }

          if (-not (Test-Path "node_modules/lightningcss-win32-x64-msvc")) {
            npm install --no-save --include=optional lightningcss-win32-x64-msvc --no-audit --no-fund
          }

      - name: Verify native build dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/@tailwindcss/oxide-win32-x64-msvc")) {
            throw "The Windows Tailwind Oxide native binding was not installed."
          }

          if (-not (Test-Path "node_modules/@rolldown/binding-win32-x64-msvc")) {
            throw "The Windows Rolldown native binding was not installed."
          }

          if (-not (Test-Path "node_modules/lightningcss-win32-x64-msvc")) {
            throw "The Windows Lightning CSS native binding was not installed."
          }

      - name: Update Version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Build App (Unsigned Installer & Packages)
        run: npm run electron-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prepare installer artifact for SignPath.io code signing
      - name: Package for SignPath.io
        id: prepare_signpath
        shell: pwsh
        run: |
          $hasToken = [bool]("${{ secrets.SIGNPATH_API_TOKEN }}" -ne "")
          Write-Output "SignPath token configured: $hasToken"
          New-Item -ItemType Directory -Force -Path "to-sign"
          Get-ChildItem -Path "release" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "to-sign/"
          }
          Compress-Archive -Path "to-sign/*" -DestinationPath "release-unsigned.zip" -Force

      # Submit signing request to SignPath.io (Free code signing for open-source projects)
      - name: Submit signing request to SignPath.io
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || 'pipeforge' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: 'signed-output'
          parameters: |
            artifact-configuration-slug: initial

      # Extract signed binaries back to release folder if SignPath completed
      - name: Integrate Signed Binaries
        shell: pwsh
        run: |
          if (Test-Path "signed-output") {
            Write-Output "Extracting signed binaries from SignPath.io..."
            Get-ChildItem -Path "signed-output" -Filter "*.zip" | ForEach-Object {
              Expand-Archive -Path $_.FullName -DestinationPath "release" -Force
            }
            Get-ChildItem -Path "signed-output" -Filter "*.exe" | ForEach-Object {
              Copy-Item $_.FullName "release/" -Force
            }
          } else {
            Write-Output "No signed-output folder found; proceeding with current build release."
          }

      - name: Publish Release
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $commitMsg = git log -1 --format=%B
          $commitMsgStr = $commitMsg -join "`n"
          Write-Output "Publishing release $tag with notes:"
          Write-Output $commitMsgStr
          $commitMsgStr | Out-File notes.txt -Encoding utf8
          if (!(gh release view $tag 2>$null)) {
            gh release create "$tag" --title "$tag" -F notes.txt --target ${{ github.sha }}
          }
          Write-Output "Uploading files to release..."
          Get-ChildItem -Path "release" -File | Where-Object { $_.Name -match "\.(exe|blockmap|yml)$" } | ForEach-Object { gh release upload "$tag" $_.FullName --clobber }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PipeForge-Windows-Build
          path: release/*.exe
